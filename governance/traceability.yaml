constitution_version: "v0.1"
test_threshold_version: "v0.1"
entries:
  - clause_id: "4.1"
    description: "L1 hard-constraint fail-closed in API entrypoint"
    behavioral: true
    status: met
    constitution_version: "v0.1"
    test_threshold_version: "v0.1"
    modules:
      - policy/hard_constraints.py
      - agora/api.py
    tests:
      - tests/test_hard_constraints.py
      - tests/test_api_hard_constraint_fail_closed.py
      - tests/test_hard_constraint_guard_exception.py
      - tests/test_e2e_hard_constraint_audit_modes.py
    coverage_note: "Hard-constraint checks run before routing and fail-closed on guard errors."

  - clause_id: "6.2"
    description: "SUSPEND_DECISION uses fixed structured output template"
    behavioral: true
    status: met
    constitution_version: "v0.1"
    test_threshold_version: "v0.1"
    modules:
      - workflows/final_decision.py
    tests:
      - tests/test_final_decision.py
    coverage_note: "SUSPEND requires REQUIRES_HUMAN_REVIEW + reason/action; free-text recommendation blocked."

  - clause_id: "5.1"
    description: "Audit daemon health-state persistence and degraded policy"
    behavioral: true
    status: met
    constitution_version: "v0.1"
    test_threshold_version: "v0.1"
    modules:
      - agora/audit_daemon.py
      - config/audit_degradation_policy.yaml
    tests:
      - tests/test_audit_daemon.py
      - tests/test_audit_health_state_persistence.py
      - tests/test_health_recovery_without_new_append.py
      - tests/test_pending_wal_events_is_derived.py
      - tests/test_audit_append_protocol_v2.py
      - tests/test_degraded_policy_enforcement.py
      - tests/test_lint_degradation_policy.py
      - tests/test_degraded_low_risk_unknown_scope.py
    coverage_note: "Health state is persisted, derived from WAL filesystem facts, and consumed by degraded enforcement."

  - clause_id: "8.1"
    description: "Release gate category normalization and overdue escalation"
    behavioral: true
    status: met
    constitution_version: "v0.1"
    test_threshold_version: "v0.1"
    modules:
      - agora/release_gate.py
      - scripts/run_release_gate.py
    tests:
      - tests/test_release_gate.py
    coverage_note: "injection_high/medium normalized to injection with detail preserved in incidents."

  - clause_id: "9.1"
    description: "Execution scope enforcement and L3 capability gate"
    behavioral: true
    status: not_met_pending_implementation
    constitution_version: "v0.1"
    test_threshold_version: "v0.1"
    modules:
      - agora/execution_controller.py
      - agora/tool_worker.py
      - config/permissions_scopes.yaml
      - config/runtime_capabilities.yaml
      - config/sandbox_spec.yaml
    tests:
      - tests/test_execution_controller.py
      - tests/test_tool_worker_flow.py
      - tests/test_tool_worker_l3_guard.py
    coverage_note: "unknown scope is strictest; sandbox operations blocked when L3 isolation is unavailable."

  - clause_id: "13.1"
    description: "Heartbeat requires auditable output by default"
    behavioral: true
    status: met
    constitution_version: "v0.1"
    test_threshold_version: "v0.1"
    modules:
      - agora/heartbeat.py
      - config/heartbeat_contract.yaml
    tests:
      - tests/test_heartbeat.py
      - tests/test_heartbeat_audit.py
    coverage_note: "Heartbeat raises if audit hook/secret missing unless explicit test override."

  - clause_id: "11.1"
    description: "Failure reports and recovery governance are machine-linted"
    behavioral: true
    status: met
    constitution_version: "v0.1"
    test_threshold_version: "v0.1"
    modules:
      - governance/failure_report_schema.yaml
      - governance/recovery_policy.yaml
      - governance/recovery_policy_schema.yaml
      - governance/traceability_whitelist.yaml
      - scripts/lint_failure_report.py
      - scripts/lint_recovery_policy.py
      - scripts/lint_traceability_whitelist.py
      - scripts/check_traceability.py
      - scripts/check_traceability_completeness.py
      - scripts/discovery_gate.py
    tests:
      - tests/test_failure_report_lint.py
      - tests/test_lint_recovery_policy.py
      - tests/test_lint_traceability_whitelist.py
    coverage_note: "Governance policy files are schema/lint guarded and completeness checked against key paths."

  - clause_id: "14.1"
    description: "Prompt catalog/registry/binding/operator policy enforce fail-closed prompt authorization"
    behavioral: true
    status: met
    constitution_version: "v0.1"
    test_threshold_version: "v0.1"
    modules:
