  - id: debate.role.general_reviewer
    type: prompt
    path: prompt_lab/roles/general_reviewer.md
    status: active
    default_enabled: true
    requires_authorization: null

  - id: orchestrator.debate
    type: prompt
    path: prompt_lab/orchestrator_system_prompt.md
    status: active
    default_enabled: true
    requires_authorization: null

  - id: profile.subagent_code_review
    type: profile
    members:
      - constitution.guard_l1
      - subagent.base
      - subagent.domain.code_reviewer
      - orchestrator.subagent
    status: active
    binding_reason_template: code_review_subagent_flow

  - id: profile.debate_code_review
    type: profile
    members:
      - constitution.guard_l1
      - debate.base
      - debate.role.security_reviewer
      - debate.role.architecture_reviewer
      - debate.role.performance_reviewer
      - debate.role.style_reviewer
      - debate.role.test_reviewer
      - debate.role.general_reviewer
      - orchestrator.debate
    status: active
    binding_reason_template: code_review_debate_flow

  - id: profile.subagent_general
    type: profile
    members:
      - constitution.guard_l1
      - subagent.base.general
      - subagent.domain.general_assistant
      - orchestrator.subagent
    status: active
    binding_reason_template: general_subagent_flow

  - id: profile.chat_direct
    type: profile
    members:
      - chat.identity
      - chat.constitution
      - chat.soul
      - chat.rules.read_before_modify
      - chat.rules.minimize_file_creation
      - chat.rules.no_unnecessary_additions
      - chat.rules.no_premature_abstractions
      - chat.rules.execute_with_care
      - chat.reminder.external_file_changes
      - chat.reminder.no_write_mode
      - chat.reminder.task_tracking
      - chat.reminder.team_coordination
      - chat.reminder.memory_maintenance
    status: active
    binding_reason_template: direct_chat_flow

  - id: profile.unknown_safe
    type: profile
    members:
      - constitution.guard_l1
      - subagent.base
      - subagent.domain.code_reviewer
      - orchestrator.subagent
    status: active
    binding_reason_template: unknown_safe_profile

  # Intentionally aligned with profile.unknown_safe for now.
  # Governance distinction is at routing intent/reason level; members may diverge in later specialization.
  - id: profile.intent_safe_fallback
    type: profile
    members:
      - constitution.guard_l1
      - subagent.base
      - subagent.domain.code_reviewer
      - orchestrator.subagent
    status: active
    binding_reason_template: intent_not_yet_specialized
